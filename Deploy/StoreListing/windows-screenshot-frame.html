<!DOCTYPE html>
<!--
  Capture Windows pour le Microsoft Store : la capture de la fenêtre de l'appli, centrée et agrandie
  pour remplir la hauteur d'une image paysage 1920x1080 (au-dessus des 1366x768 recommandés), sur le
  fond de l'appli. Paramètres : ?src=<url de la capture>&bg=<hex>&glow=<rgba css>.
  Utilisé par Build-StoreListing.ps1 (Chrome headless).
-->
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  img { width: 1820px; height: 990px; object-fit: contain; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .55)); }
</style>
</head>
<body>
  <img id="shot" alt="" />
  <script>
    const params = new URLSearchParams(location.search);
    const bg = "#" + (params.get("bg") || "000000");
    const glow = params.get("glow") || "transparent";
    document.body.style.background = `radial-gradient(ellipse at 50% -10%, ${glow}, transparent 60%), ${bg}`;
    document.getElementById("shot").src = params.get("src");
  </script>
</body>
</html>
