name: CI

# Tests unitaires + build de l'appli MAUI à chaque push et pull request.
# Les tests ne référencent que Resonance.Core (net10.0 pur, sans workload MAUI) : ce job tourne
# sur Linux et reste rapide. Le build Windows attrape ce que les tests ne voient pas (XAML compilé,
# code de la tête MAUI, ressources) : une PR qui casse la compilation de l'appli échoue ici.
# Sur les PR, Stryker mesure en plus la solidité des tests sur le code modifié (job mutation).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test Resonance.Tests/Resonance.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  build-windows:
    name: Build Windows (appli MAUI)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Workload MAUI
        run: dotnet workload install maui

      - name: Build Windows
        run: dotnet build Resonance/Resonance.csproj -f net10.0-windows10.0.19041.0 -c Debug

  # Tests de mutation (Stryker) sur la logique de Resonance.Core (Resonance.Tests/stryker-config.json) :
  # vérifie que les tests échouent bien quand le code est altéré, pas seulement qu'ils passent.
  # Sur une PR : seulement les fichiers modifiés par rapport à la branche cible (--since).
  # Lancement manuel (workflow_dispatch) : passe complète.
  mutation:
    name: Mutation (Stryker)
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Resonance.Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --since compare avec la branche cible

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installer Stryker
        run: dotnet tool install -g dotnet-stryker --version 5.1.0

      - name: Stryker
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SINCE="--since:origin/${{ github.base_ref }}"
          fi
          dotnet stryker $SINCE -r markdown -r html -r progress

      - name: Résumé
        if: always()
        run: |
          REPORT=$(find StrykerOutput -name 'mutation-report.md' | head -1)
          if [ -n "$REPORT" ]; then
            grep -v -F 'N\/A' "$REPORT" >> "$GITHUB_STEP_SUMMARY" # fichiers non mutés retirés
          else
            echo "Aucun rapport : aucun fichier muté n'a changé, ou Stryker n'a pas pu s'exécuter." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mutation
          path: Resonance.Tests/StrykerOutput/**/reports/
          if-no-files-found: ignore
