name: iOS Build (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI workloads
        run: dotnet workload restore Resonance/Resonance.csproj

      # Build a device (arm64) build without a real signing identity.
      # This produces an unsigned .ipa meant to be re-signed locally with
      # a free Apple ID (e.g. via Sideloadly) rather than installed as-is.
      - name: Build unsigned iOS IPA
        run: >
          dotnet build Resonance/Resonance.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:BuildIpa=true
          -p:CodesignKey=
          -p:CodesignProvision=
          -p:EnableCodeSigning=false

      - name: Locate IPA
        run: find Resonance/bin -iname "*.ipa" -print

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-ios-ipa
          path: Resonance/bin/Release/net10.0-ios/**/*.ipa
          if-no-files-found: error
